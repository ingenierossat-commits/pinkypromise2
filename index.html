<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa — Novedades</title>
<style>
  :root{ --white:#fff; --text:#2a1a12; --text-light:#6b5a4e; --rose-dim:#e8b4b8; }
  *{box-sizing:border-box;}
  body{margin:0;background:#faf6f3;font-family:sans-serif;padding:16px;}
  h2{font-family:Georgia,serif;font-size:15px;color:var(--text-light);margin-bottom:14px;text-align:center;}
</style>
</head>
<body>
<h2>Novedades — vista previa (9 fotos reales)</h2>

<div id="novedades-feed" style="max-width:480px;margin:0 auto;padding:8px 12px;display:grid;gap:8px;"></div>

<div id="novedad-modal" style="display:none;position:fixed;inset:0;z-index:600;background:rgba(13,8,8,0.9);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;">
  <div style="position:relative;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;">
    <button onclick="closeNovedadModal()" style="position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(13,8,8,0.55);border:none;color:#fff;font-size:1.1rem;cursor:pointer;">×</button>
    <div id="novedad-modal-content"></div>
  </div>
</div>

<script>
const novedades = {
  n1: { title: "Chocolate y oro",        text: "Manicura en marrón chocolate con foil dorado y detalles metalizados.", imageURL: "fotos/1.jpg", createdAt: "2026-09-01" },
  n2: { title: "Metálicos",              text: "Los colores del atardecer y destellos plateados sobre base cromática.", imageURL: "fotos/2.jpg", createdAt: "2026-09-02" },
  n3: { title: "Destellos holográficos", text: "Efecto holográfico suave con encapsulado de purpurina fina.",         imageURL: "fotos/3.jpg", createdAt: "2026-09-03" },
  n4: { title: "Blanco sobre blanco",    text: "Diseños delicados pero con mucho estilo, en tonos nude y blanco.",     imageURL: "fotos/4.jpg", createdAt: "2026-09-04" },
  n5: { title: "Verano pastel",          text: "French tips en colores pastel con detalles de estrellas de mar.",     imageURL: "fotos/5.jpg", createdAt: "2026-09-05" },
  n6: { title: "Efecto carey",           text: "Acabado carey translúcido con perlas metálicas.",                    imageURL: "fotos/6.jpg", createdAt: "2026-09-06" },
  n7: { title: "Animal print cristal",   text: "Base cristal con marmoleado y animal print sutil.",                   imageURL: "fotos/7.jpg", createdAt: "2026-09-07" },
  n8: { title: "Tribal rojo",            text: "Diseño tribal blanco sobre esmalte rojo con purpurina.",             imageURL: "fotos/8.jpg", createdAt: "2026-09-08" },
  n9: { title: "Cuadros vichy",          text: "Patrón de cuadros en tonos granate y rosa sobre base nude.",         imageURL: "fotos/9.jpg", createdAt: "2026-09-09" }
};

function renderNovedadesFeed() {
  const el = document.getElementById('novedades-feed');
  const listCompleta = Object.entries(novedades).sort((a,b) => b[1].createdAt.localeCompare(a[1].createdAt));
  const list = listCompleta.slice(0, 9);
  const cols = Math.min(3, Math.ceil(Math.sqrt(list.length)));
  el.style.display = 'grid';
  el.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  el.innerHTML = list.map(([id, n]) => `
    <div onclick="openNovedadModal('${id}')" style="aspect-ratio:1/1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:var(--rose-dim);">
      <img src="${n.imageURL}" alt="${n.title}" style="width:100%;height:100%;object-fit:cover;display:block;">
    </div>`).join('');
}

function openNovedadModal(id) {
  const n = novedades[id];
  if(!n) return;
  const content = document.getElementById('novedad-modal-content');
  content.innerHTML = `
    <div style="background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(13,8,8,0.3);">
      <img src="${n.imageURL}" alt="${n.title}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block;">
      <div style="padding:16px 18px 18px;">
        <div style="font-family:Georgia,serif;font-size:1.3rem;color:var(--text);font-weight:600;font-style:italic;margin-bottom:8px;line-height:1.3;">${n.title}</div>
        <div style="font-size:0.85rem;color:var(--text-light);line-height:1.7;margin-bottom:10px;">${n.text}</div>
        <div style="font-size:0.7rem;color:var(--rose-dim);letter-spacing:1px;text-transform:uppercase;">${new Date(n.createdAt).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
    </div>`;
  document.getElementById('novedad-modal').style.display = 'flex';
}
function closeNovedadModal() {
  document.getElementById('novedad-modal').style.display = 'none';
}

renderNovedadesFeed();
</script>
</body>
</html>
